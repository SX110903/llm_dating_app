services:
  backend:
    environment:
      APP_ENV: production
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?PRODUCTION_DATABASE_URL with sslmode=verify-full is required}
      REDIS_URL: ${PRODUCTION_REDIS_URL:?PRODUCTION_REDIS_URL with rediss is required}
      CORS_ALLOWED_ORIGINS: ${PRODUCTION_CORS_ALLOWED_ORIGINS:?PRODUCTION_CORS_ALLOWED_ORIGINS is required}

  frontend:
    build:
      target: runtime
    environment: !reset []
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  reverse-proxy:
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes:
      - ./reverse-proxy/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - source: tls_certificate
        target: tls_certificate
      - source: tls_private_key
        target: tls_private_key
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_PATH:?TLS_CERTIFICATE_PATH is required}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_PATH:?TLS_PRIVATE_KEY_PATH is required}
