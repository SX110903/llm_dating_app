name: llmatch-v2

services:
  postgres:
    image: postgis/postgis:17-3.6-alpine@sha256:56d997c0ac439400adfadbf0c07ebfe66ccbfee755f211173aef405b698bd81f
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/bootstrap:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0770
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  redis:
    image: redis:8.4.5-alpine@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
    user: "redis:redis"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: "postgres://llmatch_migrator:${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable&search_path=app%2Cpublic"
      MIGRATIONS_SOURCE_URL: file:///app/migrations
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      DATABASE_URL: "postgres://llmatch_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable&search_path=app%2Cpublic"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PHOTO_STORAGE_DRIVER: local
      PHOTO_STORAGE_LOCAL_DIR: /data/photos
    secrets:
      - source: jwt_private_key
        target: jwt_private.pem
      - source: jwt_public_key
        target: jwt_public.pem
    volumes:
      - photos_data:/data/photos
    networks: [edge, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_CACHE_DIR: /tmp/vite-cache
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /app/node_modules/.vite-temp:uid=1000,gid=1000,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  reverse-proxy:
    build:
      context: .
      dockerfile: reverse-proxy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  photos_data:

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_PATH:?JWT_PRIVATE_KEY_PATH is required}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_PATH:?JWT_PUBLIC_KEY_PATH is required}
